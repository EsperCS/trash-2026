experiment:
  name: baseline-01
  seed: 42

data:
  train_file: data/train.csv
  test_file: data/test.csv
  text_column: auto  # auto-detect
  label_column: auto  # auto-detect
  val_split: 0.2

model:
  type: tfidf_lr
  tfidf:
    max_features: 50000
    ngram_range: [1, 3]
    analyzer: word
    sublinear_tf: true
  logistic_regression:
    C: 1.0
    max_iter: 1000
    solver: lbfgs

output:
  model_path: models/baseline_tfidf_lr.pkl
  submission_path: submissions/baseline_submission.csv
  results_path: reports/experiment_results.csv
